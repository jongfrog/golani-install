name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: golani-windows-x64.zip
            binary: golani.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: golani-linux-x64.tar.gz
            binary: golani
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: golani-macos-x64.tar.gz
            binary: golani
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: golani-macos-arm64.tar.gz
            binary: golani
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install musl (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          $dist = "dist/${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$dist/golani.exe"
          Compress-Archive -Path "$dist/golani.exe" -DestinationPath "$dist/${{ matrix.artifact }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ github.ref_name }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ github.ref_name }}/golani
          cd dist/${{ github.ref_name }}
          tar -czf ${{ matrix.artifact }} golani
          cd ../..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ github.ref_name }}/${{ matrix.artifact }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: golani-*
          path: dist/${{ github.ref_name }}
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/${{ github.ref_name }}
          sha256sum * > CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            golani-*
            CHECKSUMS.txt
          generate_release_notes: true