[package]
name = "golani"
version = "0.1.20"
edition = "2021"
description = "Minecraft Java Edition 서버 관리 도구"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
crossterm = "0.28"
dirs = "6.0"
fs2 = "0.4"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "net", "time"] }
ratatui = "0.29"
unicode-width = "0.2"
sys-info = "0.9"

[dev-dependencies]
tempfile = "3.15"
