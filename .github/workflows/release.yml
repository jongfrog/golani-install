name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: golani.exe
            platform: windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: golani
            platform: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: golani
            platform: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: golani
            platform: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-

      - name: Install musl (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          cargo clean
          echo "=== Rust version ===" && rustc --version
          echo "=== Cargo version ===" && cargo --version
          echo "=== Profile ===" && cargo metadata --format-version=1 | jq -r '.packages[] | select(.name=="golani") | .targets[0].profile'
          echo "=== Source verification ===" && type src/main.rs | head -5
          cargo build --release --target ${{ matrix.target }} --verbose 2>&1 | tail -100
          echo "=== Binary size ===" && dir target\\${{ matrix.target }}\\release\\${{ matrix.binary }}
          echo "=== Binary info ===" && dumpbin /headers target\\${{ matrix.target }}\\release\\${{ matrix.binary }} | head -20
        shell: cmd

      - name: Build Linux/macOS
        if: runner.os != 'Windows'
        run: |
          cargo clean
          echo "=== Rust version ===" && rustc --version
          echo "=== Cargo version ===" && cargo --version
          echo "=== Source verification ===" && head -5 src/main.rs
          cargo build --release --target ${{ matrix.target }} --verbose 2>&1 | tail -100
          echo "=== Binary size ===" && ls -la target/${{ matrix.target }}/release/${{ matrix.binary }}
          echo "=== Binary info ===" && file target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: golani-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/${{ github.ref_name }}
          merge-multiple: true

      - name: Package Windows
        run: |
          cd dist/${{ github.ref_name }}
          find . -name "golani.exe" -exec mv {} . \;
          zip golani-windows-x64.zip golani.exe

      - name: Package Linux
        run: |
          cd dist/${{ github.ref_name }}
          find . -name "golani" -path "*/golani-linux-x64/*" -exec mv {} . \;
          tar -czf golani-linux-x64.tar.gz golani

      - name: Package macOS x64
        run: |
          cd dist/${{ github.ref_name }}
          find . -name "golani" -path "*/golani-macos-x64/*" -exec mv {} . \;
          tar -czf golani-macos-x64.tar.gz golani

      - name: Package macOS ARM64
        run: |
          cd dist/${{ github.ref_name }}
          find . -name "golani" -path "*/golani-macos-arm64/*" -exec mv {} . \;
          tar -czf golani-macos-arm64.tar.gz golani

      - name: Generate checksums
        run: |
          cd dist/${{ github.ref_name }}
          sha256sum * > CHECKSUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/${{ github.ref_name }}/golani-*
            dist/${{ github.ref_name }}/CHECKSUMS.txt
          generate_release_notes: true